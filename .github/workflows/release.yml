name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch LGPL libmpv DLL
        shell: pwsh
        run: |
          $url = 'https://github.com/zhongfly/mpv-winbuild/releases/download/2026-11-22-c2a42f414f/mpv-dev-lgpl-x86_64-20261122-git-c2a42f414f.7z'
          Invoke-WebRequest -Uri $url -OutFile 'mpv-dev-lgpl.7z' -TimeoutSec 300
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip)) { $sevenZip = '7z' }
          & $sevenZip x 'mpv-dev-lgpl.7z' -o'mpv-dev' -y | Out-Null
          $dll = Get-ChildItem -Path 'mpv-dev' -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in LGPL dev package' }
          New-Item -ItemType Directory -Force -Path 'bin' | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'bin/libmpv-2.dll' -Force
          Write-Host "Prepared bin/libmpv-2.dll from $($dll.FullName)"

      - name: Verify environment
        run: |
          python -c "import PySide6, mpv; print('PySide6 / python-mpv OK')"
          python -m compileall -q app main.py tests

      - name: Build single-file EXE
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build build_tools/windows/build_x64.spec

      - name: Check artifact
        shell: pwsh
        run: |
          $exe = 'dist/CXPurePlayer-v1.0.0-win-x64.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw "EXE not found: $exe" }
          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "EXE size: $size bytes"
          if ($size -lt 10000000) { throw "EXE too small: $size bytes" }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CXPurePlayer ${{ env.RELEASE_TAG }}
          body: |
            自动构建发布：${{ env.RELEASE_TAG }}

            - 单文件 EXE：`CXPurePlayer-v1.0.0-win-x64.exe`
            - 构建方式：PyInstaller onefile + LGPL libmpv
            - 完整功能与操作说明见仓库 README.md
          files: dist/CXPurePlayer-v1.0.0-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
